<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">iSaawa favicon</title>
  <desc id="desc">Black and gold iS monogram</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ad"/>
      <stop offset="0.35" stop-color="#d4a842"/>
      <stop offset="0.7" stop-color="#98651a"/>
      <stop offset="1" stop-color="#f8d875"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="18" fill="#000"/>
  <rect x="5" y="5" width="118" height="118" rx="14" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <text x="64" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="-4" fill="url(#gold)" stroke="#4b2d08" stroke-width="1.5" paint-order="stroke fill">iS</text>
</svg>
