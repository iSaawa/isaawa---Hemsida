<html lang="sv">
<head>

    * {
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at top, #1f1b2e 0%, #100e18 60%);

      font-family: 'Inter', sans-serif;
      max-width: 760px;
      margin: 0 auto;

    }

    h1 {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      background: linear-gradient(90deg, #c77dff, #e0aaff, #ffd700);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 36px;

    form {

      padding: 14px;

      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 10px;
      color: #a89cc8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {

    input:focus {

      border-color: #c77dff;
      box-shadow: 0 0 0 3px rgba(199, 125, 255, 0.2);
    }

    select {
      background-color: #15131f;
      border: 1px solid #4a3d6b;
      color: #e8e4f0;
      padding: 9px 10px;
      border-radius: 6px;
      width: 100%;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: #c77dff;
      box-shadow: 0 0 0 3px rgba(199, 125, 255, 0.2);
    }

    select option {
      background-color: #15131f;
      color: #e8e4f0;
    }
   .game-select {
  position: relative;
  width: 100%;
}

.game-select-button {
  width: 100%;
  background: #15131f;
  border: 1px solid #4a3d6b;
  color: #e8e4f0;
  padding: 9px 10px;
  border-radius: 6px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 400;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: none;
  letter-spacing: 0;
}

.game-select-button:hover {
  border-color: #c77dff;
  box-shadow: 0 0 0 3px rgba(199, 125, 255, 0.12);
  transform: none;
}

.game-select-arrow {
  color: #a89cc8;
  font-size: 14px;
}

.game-select-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  width: 100%;
  background: #15131f;
  border: 1px solid #4a3d6b;
  border-radius: 6px;
  padding: 4px;
  z-index: 100;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
}

.game-select-menu.open {
  display: block;
}

.game-select-menu button {
  width: 100%;
  background: transparent;
  color: #d0c8e8;
  border: none;
  padding: 8px 9px;
  border-radius: 4px;
  text-align: left;
  box-shadow: none;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0;
}

.game-select-menu button:hover {
  background: rgba(199, 125, 255, 0.10);
  color: #ffffff;
  box-shadow: none;
  transform: none;
}
    button {
      background: linear-gradient(135deg, #7b2ff7, #9d4edd);
      box-shadow: 0 2px 8px rgba(123, 47, 247, 0.3);
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: 6px;
      font-weight: 600;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      box-shadow: 0 0 16px rgba(199, 125, 255, 0.5);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.97);
    }

    #vapenLista_container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vapenkort {
      background: linear-gradient(145deg, #211f2e, #191725);
      border: 1px solid #3d3557;
      border-radius: 10px;
      padding: 14px 14px;
      display: grid;
      grid-template-columns: auto 1fr auto auto auto auto auto auto auto;
      align-items: center;
      gap: 18px;
      animation: fadeInUp 0.3s ease;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    /* Weaponizer Compare checkbox */
.jamforKryss {
  appearance: none;
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  min-width: 18px;
  padding: 0;
  margin: 0;

  background: #15131f;
  border: 1px solid #5b4a80;
  border-radius: 5px;

  cursor: pointer;
  display: grid;
  place-content: center;

  transition: 0.15s ease;
}

.jamforKryss:hover {
  border-color: #c77dff;
  box-shadow: 0 0 6px rgba(199, 125, 255, 0.35);
}

.jamforKryss:checked {
  background: linear-gradient(135deg, #7b2ff7, #9d4edd);
  border-color: #c77dff;
  box-shadow: 0 0 8px rgba(199, 125, 255, 0.45);
}

.jamforKryss:checked::after {
  content: "";
  width: 4px;
  height: 8px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}

    @media (max-width: 600px) {
      .vapenkort {
        grid-template-columns: 1fr;
        gap: 6px;
        text-align: left;
      }

      .vapenkort .namn {
        margin-bottom: 4px;
      }

      form {
        flex-direction: column;
        align-items: stretch;
      }

      input,
      select {
        width: 100%;
      }
    }

    .vapenkort:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(199, 125, 255, 0.15);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #varningsruta.visa {
      animation: fadeInUp 0.3s ease;
    }

    .vapenkort.basta {

      box-shadow: none;

    .compare-box {

      border-radius: 12px;

    .compare-title {

      font-weight: 700;
      font-size: 22px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      margin: 0 0 18px 0;

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .compare-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
      min-width: 520px;
    }

    .compare-table th {
      font-family: 'Rajdhani', sans-serif;
      color: #f0ebfa;
      font-size: 15px;
      padding: 10px 12px;
      text-align: center;
      letter-spacing: 0.4px;
    }

    .compare-table th:first-child {
      text-align: left;
      color: #a89cc8;
    }

    .compare-table td {
      padding: 12px;
      text-align: center;
      background: linear-gradient(145deg, #211f2e, #191725);
      border-top: 1px solid #3d3557;
      border-bottom: 1px solid #3d3557;
      color: #e8e4f0;
      font-size: 13px;
    }

    .compare-table td:first-child {
      text-align: left;
      color: #a89cc8;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-left: 1px solid #3d3557;
      border-radius: 8px 0 0 8px;
    }

    .compare-table td:last-child {
      border-right: 1px solid #3d3557;
      border-radius: 0 8px 8px 0;
    }

    .compare-table tr:hover td {
      background: linear-gradient(145deg, #262235, #1d1a29);

      color: #ffd700;

    .value-verdict-text {

      font-size: 13px;

      font-weight: 700;
      font-size: 15px;

      background: linear-gradient(90deg, #7b2ff7, #ffd700);

</head>

    <div class="field">

    <div class="field">
      <label>Price</label>

    <div class="field">

    <div class="field">

      <select id="kategorival">

      "

    function sorteraVapen() {
      vapenLista.sort(function(a, b) {

        if (a.pris === 0 && b.pris > 1) return 1;
        if (b.pris === 0 && a.pris > 1) return -1;

        if (a.pris === 1 && b.pris === 1) {
          return b.dps - a.dps;
        }

        if (a.pris > 1 && b.pris > 1) {
          return b.skadaPerKrona - a.skadaPerKrona;
        }

        if (a.pris === 0 && b.pris === 0) {
          return b.dps - a.dps;
        }

        return 0;
      });
    }


    function laddaSpelData() {

      var valtSpel = document.getElementById("spelval").value;

      if (!valtSpel || !spelData[valtSpel]) {
        return;
      }

      vapenLista = [];

      spelData[valtSpel].forEach(function(vapen) {

        vapenLista.push({
          namn: vapen.namn,
          skada: vapen.skada,
          range: vapen.range || null,
          pris: vapen.pris,
          rate: vapen.rate,
          kategori: vapen.kategori,
          attachment: "none",
          skadaPerKrona:
            vapen.pris > 1
              ? vapen.skada / vapen.pris
              : 0,
          dps: vapen.skada * vapen.rate
        });

      });

      sorteraVapen();
      sparaData();
      ritaVapen();
      
    }


    function sparaData() {
      localStorage.setItem(
        "vapenLista",
        JSON.stringify(vapenLista)
      );
    }


    if (localStorage.getItem("vapenLista")) {

      try {

        vapenLista =
          JSON.parse(localStorage.getItem("vapenLista")) || [];

        vapenLista.forEach(function(vapen) {

          if (typeof vapen.dps !== "number") {
            vapen.dps = Number(vapen.skada || 0) * Number(vapen.rate || 0);
          }

          if (typeof vapen.skadaPerKrona !== "number") {
            vapen.skadaPerKrona =
              vapen.pris > 1
                ? vapen.skada / vapen.pris
                : 0;
          }

          if (!vapen.attachment) {
            vapen.attachment = "none";
          }

        });

        sorteraVapen();

      } catch (error) {

        vapenLista = [];
        localStorage.removeItem("vapenLista");

      }
    }


    document
      .querySelector("form")
      .addEventListener("submit", function() {

        var namn =
          document.getElementById("namn").value.trim();

        namn =
          namn
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        var skada =
          Number(document.getElementById("skada").value);

        var range =
          Number(document.getElementById("range").value);

        var prisText =
          document.getElementById("pris").value;

        var pris =
          prisText.trim() === ""
            ? 1
            : Number(prisText);

        var eldhastighet =
          Number(
            document.getElementById("eldhastighet").value
          );

        var kategori =
          document.getElementById("kategorival").value;

        var attachment =
          document.getElementById("attachmentval").value;


        if (
          namn === "" ||
          !Number.isFinite(skada) ||
          skada <= 0 ||
          !Number.isFinite(eldhastighet) ||
          eldhastighet <= 0
        ) {

          visaVarning(
            "Enter a weapon name, damage and fire rate."
          );

          return;
        }


        if (!Number.isFinite(pris) || pris < 0) {

          visaVarning(
            "Price must be zero or higher."
          );

          return;
        }


        if (!Number.isFinite(range) || range < 0) {
          range = 0;
        }


        if (attachment === "silencer") {

          var valtSpel =
            document.getElementById("spelval").value;

          var suppressor =
            suppressorData[valtSpel];

          if (suppressor) {

            if (suppressor.available === false) {

              visaVarning(
                "Suppressor is not available in the selected game."
              );

              return;
            }

            skada =
              skada * suppressor.damageMultiplier;

            range =
              range * suppressor.rangeMultiplier;

          }

        }


        var skadaPerKrona =
          pris > 1
            ? skada / pris
            : 0;

        var dps =
          skada * eldhastighet;


        vapenLista.push({
          namn: namn,
          skada: skada,
          range: range,
          pris: pris,
          rate: eldhastighet,
          kategori: kategori,
          attachment: attachment,
          skadaPerKrona: skadaPerKrona,
          dps: dps
        });


        sorteraVapen();
        sparaData();
        ritaVapen();
       

        document.getElementById("namn").value = "";
        document.getElementById("skada").value = "";
        document.getElementById("range").value = "";
        document.getElementById("pris").value = "";
        document.getElementById("eldhastighet").value = "";
        document.getElementById("attachmentval").value = "none";

      });


    function visaVarning(text) {

      var ruta =
        document.getElementById("varningsruta");

      ruta.textContent = text;
      ruta.style.display = "block";
      ruta.classList.add("visa");

      setTimeout(function() {
        ruta.style.display = "none";
      }, 3000);
    }


    function taBortVapen(index) {

      vapenLista.splice(index, 1);

      sparaData();
      ritaVapen();
    }


    function hamtaSuppressorText() {

      var valtSpel =
        document.getElementById("spelval").value;

      var data =
        suppressorData[valtSpel];

      if (!data) {
        return "Game-specific suppressor data unavailable";
      }

      if (data.available === false) {
        return "Suppressor not available in this game";
      }

      var effekter = [];

      if (data.builtIn) {
        effekter.push("Built-in suppressor");
      }

      if (data.reducesSound) {
        effekter.push("Reduced sound");
      }

      if (data.reducesMuzzleFlash) {
        effekter.push("Reduced muzzle flash");
      }

      if (data.hidesTracers) {
        effekter.push("Hidden tracers");
      }

      if (data.hidesFromMinimap) {
        effekter.push("Hidden from minimap");
      }

      if (data.affectsAccuracy) {
        effekter.push("Accuracy affected");
      }

      if (data.affectsRecoil) {
        effekter.push("Recoil affected");
      }

      if (data.noRecoilMitigation) {
        effekter.push("No recoil mitigation");
      }

      if (data.reducesBulletVelocity) {
        effekter.push("Reduced bullet velocity");
      }

      if (data.reducesHipfireAccuracy) {
        effekter.push("Reduced hip-fire accuracy");
      }

      if (data.informationDenial) {
        effekter.push("Information denial");
      }

      if (data.multipleSuppressorTypes) {
        effekter.push("Multiple suppressor types");
      }

      if (effekter.length === 0) {
        return "No additional suppressor effects stored";
      }

      return effekter.join(" • ");
    }

          '</b></div>' +

          (
            harPris

              ? '<div class="stat">' +
                'Price<br><b>' +
                (
                  vapen.pris === 0
                    ? 'FREE'
                    : vapen.pris
                ) +
                '</b></div>'

              : '<div class="stat"></div>'
          ) +

          '<div class="stat">' +
          'Shots/sec<br><b>' +
          vapen.rate +
          '</b></div>' +

          '<div class="stat">' +
          'DPS<br><b>' +
          Math.round(vapen.dps) +
          '</b></div>' +

          (
            harPris

              ? '<div class="ratio">' +
                (
                  vapen.pris === 0
                    ? 'FREE'
                    : vapen.skadaPerKrona.toFixed(2)
                ) +
                '<br>' +
                '<span style="' +
                'font-size:11px;' +
                'color:#a89cc8;' +
                'font-weight:400;' +
                '">' +
                'dmg/cost' +
                '</span>' +
                '</div>'

              : '<div class="ratio">' +
                Math.round(vapen.dps) +
                '<br>' +
                '<span style="' +
                'font-size:11px;' +
                'color:#a89cc8;' +
                'font-weight:400;' +
                '">' +
                'DPS-rank' +
                '</span>' +
                '</div>'
          ) +

          '<button class="ta-bort-btn" data-index="' +
          i +
          '">' +
          'Remove' +
          '</button>';


        kort
          .querySelector(".ta-bort-btn")
          .addEventListener(
            "click",
            function() {
              taBortVapen(i);
            }
          );


        container.appendChild(kort);
      });


      filtreraVapen();
    }


    function filtreraVapen() {

      var sok =
        document
          .getElementById("sokfalt")
          .value
          .toLowerCase();

      var kategori =
        document
          .getElementById("kategorifilter")
          .value;

      var kort =
        document.querySelectorAll(".vapenkort");


      kort.forEach(function(element) {

        var namn =
          element
            .querySelector(".namn")
            .textContent
            .toLowerCase();

        var kortKategori =
          element.getAttribute("data-kategori");


        var matcharSok =
          namn.includes(sok);

        var matcharKategori =
          kategori === "alla" ||
          kategori === kortKategori;


        element.style.display =
          matcharSok && matcharKategori
            ? "grid"
            : "none";
      });
    }


    function jamforValda() {

      var valda =
        Array.from(
          document.querySelectorAll(
            ".jamforKryss:checked"
          )
        );


      if (valda.length < 2) {

        visaVarning(
          "Select at least two weapons to compare."
        );

        return;
      }


      var index =
        valda.map(function(kryss) {
          return Number(kryss.value);
        });


      var vapen =
        index
          .map(function(i) {
            return vapenLista[i];
          })
          .filter(Boolean);


      visaJamforelse(vapen);
    }


    function visaJamforelse(vapen) {

      var diagram =
        document.getElementById("diagram");

      if (!vapen || vapen.length < 2) {
        diagram.innerHTML = "";
        return;
      }


      var hogstDps =
        Math.max.apply(
          null,
          vapen.map(function(v) {
            return v.dps;
          })
        );


      var hogstDamage =
        Math.max.apply(
          null,
          vapen.map(function(v) {
            return v.skada;
          })
        );


      var html =
        '<div class="compare-box">' +

        '<div class="compare-title">' +
        'Weapon Comparison' +
        '</div>' +

        '<table class="compare-table">' +

        '<thead><tr>' +

        '<th>Stat</th>';


      vapen.forEach(function(v) {
        html += '<th>' + v.namn + '</th>';
      });


      html +=
        '</tr></thead><tbody>';


      html +=
        '<tr><td>Damage</td>';

      vapen.forEach(function(v) {

        html +=
          '<td class="' +
          (
            v.skada === hogstDamage
              ? 'compare-winner'
              : ''
          ) +
          '">' +
          v.skada +
          '</td>';

      });

      html += '</tr>';


      html +=
        '<tr><td>DPS</td>';

      vapen.forEach(function(v) {

        html +=
          '<td class="' +
          (
            v.dps === hogstDps
              ? 'compare-winner'
              : ''
          ) +
          '">' +
          Math.round(v.dps) +
          '</td>';

      });

      html += '</tr>';


      html +=
        '<tr><td>Fire rate</td>';

      vapen.forEach(function(v) {
        html +=
          '<td>' +
          v.rate +
          '</td>';
      });

      html += '</tr>';


      html +=
        '<tr><td>Range</td>';

      vapen.forEach(function(v) {
        html +=
          '<td>' +
          (
            v.range
              ? v.range
              : 'N/A'
          ) +
          '</td>';
      });

      html += '</tr>';


      html +=
        '<tr><td>Attachment</td>';

      vapen.forEach(function(v) {
        html +=
          '<td>' +
          (
            v.attachment === "silencer"
              ? "Silencer"
              : "None"
          ) +
          '</td>';
      });

      html += '</tr>';


      html +=
        '</tbody></table>';

var playstyle =
  document.getElementById("playstyle").value;

var vinnare =
  vapen
    .slice()
    .sort(function(a, b) {
      return (
        hamtaAIScore(b, playstyle) -
        hamtaAIScore(a, playstyle)
      );
    })[0];


      html +=

        '<div class="value-verdict">' +

        '<div class="value-verdict-title">' +
        'WEAPONIZER VERDICT' +
        '</div>' +

'<div class="value-verdict-text">' +
vinnare.namn +
(
  playstyle === "aggressive"
    ? ' is the strongest choice for an aggressive playstyle, with a strong balance of DPS, fire rate and damage.'
    : playstyle === "defensive"
    ? ' is the strongest defensive choice based on damage, DPS and range.'
    : playstyle === "close"
    ? ' is the strongest close-range choice because of its DPS and fire rate.'
    : playstyle === "long"
    ? ' is the strongest long-range choice based on damage and range.'
    : ' offers the strongest overall balance in this comparison.'
) +
'</div>' +

        '</div>' +

        '</div>';


      diagram.innerHTML = html;
    }


    


    function hamtaAIScore(vapen, playstyle) {

      var dps =
        Number(vapen.dps) || 0;

      var damage =
        Number(vapen.skada) || 0;

      var rate =
        Number(vapen.rate) || 0;

      var range =
        Number(vapen.range) || 0;


      if (playstyle === "aggressive") {

        return (
          dps * 1.3 +
          rate * 8 +
          damage * 0.3
        );
      }


      if (playstyle === "defensive") {

        return (
          damage * 1.1 +
          dps * 0.7 +
          range * 0.4
        );
      }


      if (playstyle === "close") {

        return (
          dps * 1.2 +
          rate * 10
        );
      }


      if (playstyle === "long") {

        return (
          damage * 1.2 +
          range * 1.2
        );
      }


      return (
        dps +
        damage * 0.5 +
        range * 0.25
      );
    }


    document
      .getElementById("playstyle")
      .addEventListener(
        "change",
        function() {
        }
      );


    ritaVapen();
