<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weaponizer – Test Login</title>
	<meta name="description" content="Log in to Weaponizer to test our game enhancement project.">

	<meta property="og:description" content="Log in to Weaponizer to test our game enhancement project.">

	<meta property="og:image:alt" content="iSaawa - music and IT/game development">
	<meta property="og:type" content="website">

	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Weaponizer – Test Login">
	<meta name="twitter:description" content="Log in to Weaponizer to test our game enhancement project.">
	<meta name="twitter:image" content="isaawa-huvudlogga.jpeg">
	<link rel="icon" type="image/svg+xml" href="favicon.svg">
	<link rel="icon" type="image/jpeg" href="isaawa-huvudlogga.jpeg">
	<link rel="stylesheet" href="styles.css">
	<link rel="canonical" href="https://isaawa.github.io/isaawa---Hemsida/weaponizer-login-en.html">
	<style>
		.login-container {
			width: 100%;
			max-width: 400px;
			margin: 0 auto;
			padding: 2rem;
			background: linear-gradient(145deg, #1a1a1a, #050505);
			border: 1px solid rgba(212, 168, 66, .35);
			border-radius: 1rem;
			box-shadow: 0 0 2rem rgba(212, 168, 66, .12), inset 0 1px rgba(255, 235, 174, .08);
		}

		.login-container h2 {
			margin: 0 0 1.5rem;
			color: #f1d277;
			font-family: Georgia, "Times New Roman", serif;
			font-size: 1.8rem;
			text-align: center;
		}

		.login-form {
			display: flex;
			flex-direction: column;
			gap: 1.2rem;
		}

		.form-group {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.form-group label {
			color: #fff0ad;
			font-weight: 600;
			font-size: 0.95rem;
			letter-spacing: 0.02em;
		}

		.form-group input {
			padding: 0.75rem 1rem;
			border: 1px solid #d4a842;
			border-radius: 0.5rem;
			background: #050505;
			color: #f2f4f6;
			font-size: 1rem;
			transition: all 0.2s ease;
			box-shadow: 0 0 0.5rem rgba(212, 168, 66, .08), inset 0 1px rgba(255, 240, 173, .1);
		}

		.form-group input::placeholder {
			color: rgba(242, 244, 246, .5);
		}

		.form-group input:focus {
			outline: none;
			border-color: #fff0ad;
			box-shadow: 0 0 0.8rem rgba(212, 168, 66, .25), inset 0 1px rgba(255, 240, 173, .15);
		}

		.login-button {
			padding: 0.85rem 1.5rem;
			border: 1px solid #d4a842;
			border-radius: 0.5rem;
			background: linear-gradient(135deg, #7650a8, #3d255f);
			color: #f2f4f6;
			font-weight: 700;
			font-size: 1rem;
			cursor: pointer;
			transition: all 0.2s ease;
			box-shadow: 0 0 0.9rem rgba(218, 174, 76, .18), inset 0 1px rgba(255, 240, 173, .2);
		}

		.login-button:hover {
			transform: translateY(-2px);
			background: linear-gradient(135deg, #8e65c0, #513276);
			box-shadow: 0 0 1.2rem rgba(218, 174, 76, .35), inset 0 1px rgba(255, 240, 173, .3);
		}

		.login-back {
			display: block;
			text-align: center;
			margin-top: 1.5rem;
			color: #fff0ad;
			text-decoration: none;
			font-size: 0.95rem;
			transition: all 0.2s ease;
		}

		.login-back:hover {
			color: #ffffff;
			text-shadow: 0 0 0.7rem rgba(218, 174, 76, .7);
		}

		.login-message {
			margin-top: 1rem;
			padding: 1rem;
			border-radius: 0.5rem;
			background: linear-gradient(135deg, rgba(118, 80, 168, .15), rgba(61, 37, 95, .15));
			border: 1px solid #d4a842;
			color: #fff0ad;
			text-align: center;
			font-weight: 500;
			box-shadow: 0 0 0.8rem rgba(212, 168, 66, .15), inset 0 1px rgba(255, 240, 173, .1);
			display: none;
		}

		.login-message.show {
			display: block;
			animation: fadeIn 0.3s ease;
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(-10px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}
	</style>
</head>
<body id="top">
	<nav class="language-switcher" aria-label="Choose language">
		<a class="language-button" href="weaponizer-login.html" aria-label="Swedish"><span>SWE</span><span aria-hidden="true">🇸🇪</span></a>
		<a class="language-button active" href="weaponizer-login-en.html" aria-label="English, active language" aria-current="page"><span>ENG</span><span aria-hidden="true">🇬🇧</span></a>
	</nav>

	<div class="site-sections">
		<a class="hero-button back-button" href="it-projects-en.html">Back</a>

		<section class="site-section" aria-labelledby="login-heading">
			<h1 class="section-heading" id="login-heading">Weaponizer</h1>
			<div class="login-container">
				<h2>Test Login</h2>
				<form class="login-form" id="loginForm">
					<div class="form-group">
						<label for="email">Email</label>
						<input type="email" id="email" name="email" placeholder="your@email.com" required>
					</div>
					<div class="form-group">
						<label for="password">Password</label>
						<input type="password" id="password" name="password" placeholder="Enter your password" required>
					</div>
					<button type="button" class="login-button" id="loginBtn">Log in</button>
					<div class="login-message" id="loginMessage">The test area will open soon for selected testers.</div>
				</form>
				<a href="it-projects-en.html" class="login-back">Back to projects</a>
			</div>
		</section>
	</div>

	<footer class="site-footer">
		<p>© 2026 iSaawa</p>
		<p>Music, IT and creative projects.</p>
		<nav class="footer-links" aria-label="Footer links">
			<a href="index-en.html">Home</a>
			<a href="music-en.html">Music</a>
			<a href="it-projects-en.html">IT &amp; game projects</a>
			<a href="https://suno.com/@isaawa" target="_blank" rel="noopener noreferrer">Suno</a>
			<a href="#top">To top</a>
		</nav>
	</footer>
	<script>
		document.addEventListener('DOMContentLoaded', function() {
			const loginBtn = document.getElementById('loginBtn');
			const loginMessage = document.getElementById('loginMessage');
			const loginForm = document.getElementById('loginForm');

			loginBtn.addEventListener('click', function(e) {
				e.preventDefault();
				loginMessage.classList.add('show');
			});
		});
	</script>
</body>
</html>
