	<style>
		.login-container {
			width: 100%;
			max-width: 400px;
			margin: 0 auto;
			padding: 2rem;
			background: linear-gradient(145deg, #1a1a1a, #050505);
			border: 1px solid rgba(212, 168, 66, .35);
			border-radius: 1rem;
			box-shadow: 0 0 2rem rgba(212, 168, 66, .12), inset 0 1px rgba(255, 235, 174, .08);
		}

		.login-container h2 {
			margin: 0 0 1.5rem;
			color: #f1d277;
			font-family: Georgia, "Times New Roman", serif;
			font-size: 1.8rem;
			text-align: center;
		}

		.login-form {
			display: flex;
			flex-direction: column;
			gap: 1.2rem;
		}

		.form-group {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.form-group label {
			color: #fff0ad;
			font-weight: 600;
			font-size: 0.95rem;
			letter-spacing: 0.02em;
		}

		.form-group input {
			padding: 0.75rem 1rem;
			border: 1px solid #d4a842;
			border-radius: 0.5rem;
			background: #050505;
			color: #f2f4f6;
			font-size: 1rem;
			transition: all 0.2s ease;
			box-shadow: 0 0 0.5rem rgba(212, 168, 66, .08), inset 0 1px rgba(255, 240, 173, .1);
		}

		.form-group input::placeholder {
			color: rgba(242, 244, 246, .5);
		}

		.form-group input:focus {
			outline: none;
			border-color: #fff0ad;
			box-shadow: 0 0 0.8rem rgba(212, 168, 66, .25), inset 0 1px rgba(255, 240, 173, .15);
		}

		.login-back {
			display: block;
			text-align: center;
			margin-top: 1.5rem;
			color: #fff0ad;
			text-decoration: none;
			font-size: 0.95rem;
			transition: all 0.2s ease;
		}

		.login-back:hover {
			color: #ffffff;
			text-shadow: 0 0 0.7rem rgba(218, 174, 76, .7);
		}

		.login-message {
			margin-top: 1rem;
			padding: 1rem;
			border-radius: 0.5rem;
			background: linear-gradient(135deg, rgba(118, 80, 168, .15), rgba(61, 37, 95, .15));
			border: 1px solid #d4a842;
			color: #fff0ad;
			text-align: center;
			font-weight: 500;
			box-shadow: 0 0 0.8rem rgba(212, 168, 66, .15), inset 0 1px rgba(255, 240, 173, .1);
			display: none;
		}

		.login-message.show {
			display: block;
			animation: fadeIn 0.3s ease;
		}

		.site-footer {
			border: 1px solid transparent;
			background: linear-gradient(145deg, #030304, #160d24) padding-box, linear-gradient(135deg, #70501f, #d4a842 28%, #8f621c 50%, #f1d277 72%, #70501f) border-box;
			box-shadow: 0 0 1rem rgba(118, 80, 168, .12), 0 0 .35rem rgba(212, 168, 66, .16), inset 0 1px rgba(255, 235, 174, .08), inset 0 -1px rgba(56, 31, 10, .45);
		}

		.site-footer .footer-credit {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: .75rem;
			margin: 1rem auto 0;
			padding: .8rem 0;
			color: #d4a842;
		}

		.site-footer .footer-credit::before,
		.site-footer .footer-credit::after {
			content: "";
			flex: 0 1 7rem;
			height: 1px;
			background: linear-gradient(90deg, transparent, #8f621c 20%, #f1d277 50%, #8f621c 80%, transparent);
			box-shadow: 0 0 4px rgba(212, 168, 66, .18);
		}

		.site-footer .footer-links a {
			background: linear-gradient(180deg, #f1d277 0%, #d4a842 42%, #8f621c 70%, #d4a842 100%);
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
			text-shadow: 0 0 0 rgba(0, 0, 0, 0);
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(-10px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}
	</style>
</head>
<body id="top">
	<nav class="language-switcher" aria-label="Choose language">

	<nav class="main-nav" aria-label="Main menu">

	</nav>
	<div class="page-back-wrap">
		<button type="button" class="premium-clickable-button page-back-button" aria-label="Back" onclick="history.back()">←</button>
	</div>

	<div class="site-sections">
		<section class="site-section" aria-labelledby="login-heading">
			<h1 class="section-heading" id="login-heading">Weaponizer</h1>
			<div class="login-container">
				<h2>Test Login</h2>
				<form class="login-form" id="loginForm">
					<div class="form-group">
						<label for="email">Email</label>
						<input type="email" id="email" name="email" placeholder="your@email.com" required>
					</div>
					<div class="form-group">
						<label for="password">Password</label>
						<input type="password" id="password" name="password" placeholder="Enter your password" required>
					</div>
					<button type="button" class="premium-clickable-button login-button" id="loginBtn">Log in</button>
					<div class="login-message" id="loginMessage">The test area will open soon for selected testers.</div>
				</form>
				<a href="it-projects-en.html" class="login-back">Back to projects</a>
			</div>
		</section>
	</div>

	<footer class="site-footer">
		<p>© 2026 iSaawa</p>
		<p>Music, IT, Gaming and creative projects.</p>
		<p class="footer-credit">— Created by Father and Son —</p>
		<nav class="footer-links" aria-label="Footer links">

			<a href="music-en.html">Music</a>
			<a href="it-projects-en.html">IT &amp; game projects</a>
			<a href="#top">Back to top</a>
		</nav>
	</footer>
	<script>
		document.addEventListener('DOMContentLoaded', function() {
			const loginBtn = document.getElementById('loginBtn');
			const loginMessage = document.getElementById('loginMessage');
			const loginForm = document.getElementById('loginForm');

			loginBtn.addEventListener('click', function(e) {
				e.preventDefault();
				loginMessage.classList.add('show');
			});
		});
	</script>
</body>
